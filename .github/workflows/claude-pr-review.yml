name: PR Review
on:
  pull_request:
    # Deliberately NOT triggering on `synchronize` to control metered cost —
    # when enabled, review runs once per PR open / ready / reopen, not on every push.
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    # PRO-02: Disabled because the Action bootstraps via an unverified remote script.
    # Before re-enabling, provide a fixed, hash-verified CLI through
    # path_to_claude_code_executable and update the bootstrap regression test.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # scope the workflow token supplied below
      pull-requests: write     # leave review comments
    steps:
      # Secret guard: skip green when the auth secret is absent so repos
      # without it configured don't get red-X failures on every PR.
      # (The `secrets` context isn't allowed in job-level `if`, so the check
      # lives in a step and gates the rest via its output.)
      - name: Check for review token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret not set — skipping Claude PR review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.available == 'true'
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        if: steps.token.outputs.available == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # An explicit prompt without progress tracking selects agent mode;
          # tag mode would add editing and commit/push tools.
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR. High-signal only, skip nitpicks. Priority order:
            1. Factual errors and broken or dead links
            2. Anything that leaks private info (this repo is PUBLIC)
            3. Clarity: does the prose say what it means, concisely
            Inline comments for specific lines, one top-level verdict comment.
            Do NOT approve or merge.
          claude_args: |
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
